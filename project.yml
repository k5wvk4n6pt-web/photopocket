name: PhotoPocket
options:
  bundleIdPrefix: com.k5wvk4n6pt
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhotoPocket:
    type: application
    platform: iOS
    sources:
      - PhotoPocket
    scheme: {}
    settings:
      base:
        # ↓ App Store Connect で登録するバンドルIDに書き換えてください
        PRODUCT_BUNDLE_IDENTIFIER: com.k5wvk4n6pt.photopocket
        # ↓ iCloudコンテナID（"iCloud." + バンドルID が基本）
        ICLOUD_CONTAINER: iCloud.com.k5wvk4n6pt.photopocket
        # iCloudの環境：最初の1回だけ Development、確認後は Production（README参照）
        CLOUDKIT_ENV: Production
        # プッシュ通知の環境（TestFlight・App Store用のビルドでは production に切り替え）
        APS_ENV: development
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PhotoPocket/Info.plist
      properties:
        CFBundleDisplayName: フォトポケット
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: 取り込んだ写真を写真アプリから削除するために、写真ライブラリへのアクセスを使用します。
        NSPhotoLibraryAddUsageDescription: アプリで整理した写真を写真アプリに書き出すために使用します。
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: PhotoPocket/PhotoPocket.entitlements
      properties:
        aps-environment: $(APS_ENV)
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - $(ICLOUD_CONTAINER)
        com.apple.developer.icloud-container-environment: $(CLOUDKIT_ENV)
