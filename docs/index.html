<style>
:root{--accent:#F2678A;--accent-soft:#FFE6EC;--bg:#FFF9F5;--card:#fff;--text:#5B3A21;--sub:#9A8070;--line:#F3E6DC;--danger:#E5484D}
html.dark{--bg:#141210;--card:#29261f;--text:#f3ece6;--sub:#a99c92;--line:#3a352e;--accent-soft:#4a2530}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#e9e1d8}
html.dark,html.dark body{background:#000}
body{font-family:"M PLUS Rounded 1c",ui-rounded,"Hiragino Maru Gothic ProN",sans-serif;color:var(--text);display:flex;justify-content:center}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;-webkit-font-smoothing:antialiased;font-feature-settings:"liga";width:1em;height:1em;overflow:hidden;white-space:nowrap;text-align:center;vertical-align:middle}
#app{width:100%;max-width:430px;min-height:100%;background:var(--bg);position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;padding-bottom:120px;transition:transform .32s cubic-bezier(.2,.8,.2,1);background:var(--bg)}
.screen.off{transform:translateX(100%)}
.screen.under{transform:translateX(-25%)}
.nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.nav button{background:none;border:none;color:var(--accent);padding:6px;cursor:pointer;display:flex;align-items:center;font:inherit;font-weight:700}
.big-title{font-size:30px;font-weight:800;margin:4px 18px 14px}
.card{background:var(--card);border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.badge{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent-soft);color:var(--accent)}
.row{display:flex;align-items:center;gap:12px}
.sub{color:var(--sub);font-size:13px}
.wrap{padding:0 18px}
.sec-head{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec-head h2{font-size:19px;margin:0;flex:1;font-weight:800}
.round-btn{width:36px;height:36px;border-radius:50%;background:var(--card);border:none;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fcard{padding:10px;cursor:pointer;transition:transform .15s}
.fcard:active{transform:scale(.97)}
.cover{aspect-ratio:4/3;border-radius:14px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .tab{position:absolute;left:8px;top:8px;width:22px;height:6px;border-radius:3px}
.fname{font-weight:700;font-size:15px;margin:9px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addcard{border:2px dashed #D9BFA6;border-radius:20px;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;font-weight:700;font-size:14px;cursor:pointer;background:none}
.bigbtn{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:15px 28px;font:inherit;font-weight:800;font-size:16px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 6px 16px rgba(242,103,138,.35);cursor:pointer}
.bigbtn:active{transform:scale(.96)}
.textbtn{background:none;border:none;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:10px}
.fab{position:absolute;left:0;right:0;bottom:108px;display:flex;justify-content:center;z-index:6;pointer-events:none}
.fab>*{pointer-events:auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.th{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;cursor:pointer;background:var(--accent-soft)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .lib{position:absolute;left:4px;bottom:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center}
.th .lib .ms{font-size:13px}
.th .memo{position:absolute;right:5px;bottom:5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.th .memo .ms{font-size:16px}
.th .chk{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.2)}
.th.sel{outline:3px solid var(--accent);outline-offset:-3px}
.th.sel .chk{background:var(--accent);display:flex;align-items:center;justify-content:center}
.th.sel::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.25)}
.empty{text-align:center;padding:50px 24px}
.halo{width:150px;height:150px;border-radius:50%;background:rgba(242,103,138,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.halo>div{width:104px;height:104px;border-radius:50%;background:rgba(242,103,138,.2);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.halo .ms{font-size:48px}
.empty h3{font-size:23px;margin:0 0 10px;font-weight:800}
.empty p{color:var(--sub);font-size:14px;line-height:1.8;margin:0 0 22px}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:30px}
.overlay.show .sheet{transform:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:2}
.sheet-head b{font-size:16px}
.field{background:var(--card);border-radius:14px;margin:0 16px 16px;padding:4px 14px}
.field label{display:block;font-size:12px;color:var(--sub);padding-top:10px}
.field input,.field select{width:100%;border:none;background:none;font:inherit;font-size:17px;color:var(--text);padding:8px 0 12px;outline:none}
.colors{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:12px 0}
.colors button,.icons button{border:none;cursor:pointer}
.colors button{width:38px;height:38px;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;color:#fff}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:12px 0}
.icons button{width:50px;height:50px;border-radius:50%;margin:auto;background:rgba(127,127,127,.12);color:var(--text);display:flex;align-items:center;justify-content:center}
.icons button.on{background:var(--accent-soft);color:var(--accent)}
.preview{text-align:center;padding:6px 0 18px}
.preview .badge{width:76px;height:76px;margin:0 auto 10px}
.preview .badge .ms{font-size:36px}
.preview b{font-size:19px}
.action{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;padding:10px;opacity:0;pointer-events:none;transition:opacity .2s}
.action.show{opacity:1;pointer-events:auto}
.action-box{width:100%;transform:translateY(30px);transition:transform .25s}
.action.show .action-box{transform:none}
.ab-group{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:8px;text-align:center}
.ab-title{padding:14px 16px;border-bottom:1px solid var(--line)}
.ab-title b{display:block;font-size:14px;color:var(--sub);margin-bottom:4px}
.ab-title span{font-size:12.5px;color:var(--sub);line-height:1.6;display:block}
.ab-group button{display:block;width:100%;padding:16px;border:none;background:none;font:inherit;font-size:17px;color:var(--accent);border-bottom:1px solid var(--line);cursor:pointer}
.ab-group button:last-child{border-bottom:none}
.ab-group button.danger{color:var(--danger)}
.ab-group button.bold{font-weight:800}
.viewer{position:absolute;inset:0;background:#000;z-index:15;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .2s;color:#fff}
.viewer.show{opacity:1;pointer-events:auto}
.v-top,.v-bot{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(20,20,20,.9)}
.v-top button,.v-bot button{background:none;border:none;color:#fff;font:inherit;cursor:pointer;padding:6px}
.v-top button{color:var(--accent);font-weight:700}
.v-img{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;touch-action:pan-y}
.v-img img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .2s}
.v-memo{position:absolute;bottom:16px;left:16px;right:16px;text-align:center}
.v-memo span{background:rgba(0,0,0,.6);padding:8px 14px;border-radius:10px;font-size:14px;display:inline-block}
.v-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-20px);background:rgba(40,35,30,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:50;opacity:0;transition:all .25s;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.selbar{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--card);display:flex;justify-content:space-around;align-items:center;padding:12px 10px 22px;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
.selbar button{background:none;border:none;color:var(--accent);display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
.selbar button:disabled{opacity:.35}
.list{background:var(--card);border-radius:16px;margin:0 16px 16px;overflow:hidden}
.list .li{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-top:none;font:inherit;color:var(--text);text-align:left}
.list .li:last-child{border-bottom:none}
.list-h{font-size:13px;color:var(--sub);margin:14px 30px 6px}
.note{font-size:12px;color:var(--sub);margin:-8px 30px 18px;line-height:1.6}
.demo-tag{position:absolute;left:20px;top:26px;z-index:60;background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;opacity:.85}
.seg{display:flex;background:rgba(127,127,127,.12);border-radius:10px;padding:3px;margin:8px 0 12px}
.seg button{flex:1;border:none;background:none;font:inherit;font-size:13px;padding:8px 4px;border-radius:8px;color:var(--text);cursor:pointer}
.seg button.on{background:var(--card);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.benefit{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.benefit:last-child{margin-bottom:0}
.benefit .badge{width:42px;height:42px}
.menu{position:absolute;z-index:25;background:var(--card);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:230px;overflow:hidden;display:none}
.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border:none;background:none;font:inherit;font-size:15px;color:var(--text);border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.menu button:last-child{border-bottom:none}
.menu button.danger{color:var(--danger)}
.menu button .ms{font-size:20px}
.menu-mask{position:absolute;inset:0;z-index:24;display:none}
.hero{position:relative;height:140px;overflow:hidden}
.hero>svg{position:absolute;inset:0;width:100%;height:100%}
.hero-btn{position:absolute;top:14px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.92);border:none;box-shadow:0 4px 12px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:inherit;font-size:11px;font-weight:800;color:#5B3A21;cursor:pointer;z-index:2}
.hero-btn.l{left:14px}.hero-btn.r{right:14px}
.hero-title{position:absolute;left:50%;top:28px;transform:translateX(-50%);width:max-content;display:flex;align-items:center;gap:6px;z-index:1}
.hero-title b{font-size:25px;font-weight:800;color:#5B3A21 !important;text-shadow:0 0 6px #fff,0 0 2px #fff;letter-spacing:.5px;position:relative;white-space:nowrap}
.hero-title b::after{content:"";position:absolute;left:4px;right:0;bottom:-8px;height:6px;border-radius:6px;background:#F2678A;opacity:.85;transform:rotate(-1.5deg)}
.greet{background:#FFE9EC;border-radius:22px;padding:16px;display:flex;gap:12px;align-items:center;box-shadow:0 3px 10px rgba(242,103,138,.12)}
.icl{background:#E6F2FF;border-radius:22px;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;box-shadow:0 3px 10px rgba(10,132,255,.1)}
html.dark .greet{background:#3b2228}html.dark .icl{background:#1d2a3a}
.addchip{border:none;background:var(--accent);color:#fff;font:inherit;font-weight:800;font-size:13px;border-radius:999px;padding:7px 14px 7px 10px;display:inline-flex;align-items:center;gap:2px;cursor:pointer;box-shadow:0 3px 8px rgba(242,103,138,.3)}
.addchip .ms{font-size:18px}
.ccard{padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .15s;position:relative}
.ccard:active,.fcard:active{transform:scale(.97)}
.cicon{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.cicon .ms{font-size:32px}
.cname{font-size:17px;font-weight:800}
.mini{display:flex;margin-top:2px}
.mini span{width:28px;height:28px;border-radius:8px;border:2px solid var(--card);margin-right:-8px;background-size:cover;background-position:center}
.chev{position:absolute;right:12px;top:16px;color:var(--sub)}
.fold{position:relative;aspect-ratio:1.45;margin:4px 4px 0}
.fold .back{position:absolute;left:0;right:0;bottom:0;top:8%;border-radius:16px}
.fold .tabp{position:absolute;left:0;top:0;width:44%;height:22%;border-radius:12px 12px 0 0}
.fold .front{position:absolute;left:0;right:0;bottom:0;height:72%;border-radius:16px}
.fold .pic{position:absolute;left:24%;top:22%;width:56%;height:62%;background:#fff;padding:5px;border-radius:6px;transform:rotate(-6deg);box-shadow:0 3px 8px rgba(0,0,0,.15)}
.fold .pic div{width:100%;height:100%;border-radius:3px;background-size:cover;background-position:center}
.frow{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 6px 2px}
.frow b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plus{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.tabbar{position:absolute;left:12px;right:12px;bottom:12px;z-index:8;background:var(--card);border-radius:28px;box-shadow:0 6px 20px rgba(0,0,0,.1);display:flex;padding:7px}
.tabbar button{flex:1;border:none;background:none;font:inherit;font-size:11px;font-weight:800;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:22px;cursor:pointer}
.tabbar button .ms{font-size:26px;color:var(--text)}
.tabbar button.on{background:var(--accent-soft)}
.tabbar button.on .ms{color:var(--accent)}
.tabbar.hide{display:none}
.root-title{font-size:26px;font-weight:800;margin:24px 18px 14px}
.dayh{font-size:14px;font-weight:800;margin:18px 4px 8px}
.flist .li .ms{font-size:22px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.stat{flex:1;background:var(--card);border:none;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;box-shadow:0 3px 10px rgba(91,58,33,.05);font:inherit;color:var(--text);cursor:pointer;text-align:left}
.stat:active{transform:scale(.97)}
.stat .sic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.stat .sic .ms{font-size:18px}
.stat b{font-size:19px;font-weight:800;margin-top:2px}
.stat>span:last-child{font-size:11.5px;color:var(--sub);margin-top:-4px}
html.dark .stat .sic{filter:brightness(.8)}
</style>
</head>
<body>
<div id="app">

  <!-- ホーム -->
  <section class="screen" id="home"></section>
  <section class="screen off" id="cat"></section>
  <!-- フォルダ -->
  <section class="screen off" id="folder"></section>

  <nav class="tabbar" id="tabbar"></nav>
  <!-- 写真ビューア -->
  <div class="viewer" id="viewer">
    <div class="v-top"><button onclick="closeViewer()">閉じる</button><span id="v-title" style="font-size:13px"></span><span id="v-lib" class="ms" style="color:#aaa;font-size:20px;width:30px"></span></div>
    <div class="v-img" id="v-img">
      <img id="v-pic" alt="">
      <button class="v-arrow" style="left:10px" onclick="stepViewer(-1)" aria-label="前の写真"><span class="ms">chevron_left</span></button>
      <button class="v-arrow" style="right:10px" onclick="stepViewer(1)" aria-label="次の写真"><span class="ms">chevron_right</span></button>
      <div class="v-memo" id="v-memo"></div>
    </div>
    <div class="v-bot">
      <button onclick="sharePhotos([curPhoto()])" aria-label="共有"><span class="ms">ios_share</span></button>
      <button onclick="openMemo()" aria-label="メモ"><span class="ms" id="v-memo-ic">chat_bubble</span></button>
      <button onclick="openMove('viewer')" aria-label="移動"><span class="ms">folder</span></button>
      <button onclick="viewerMenu()" aria-label="削除など"><span class="ms">delete</span></button>
    </div>
  </div>

  <!-- シート -->
  <div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
  <!-- アクションシート -->
  <div class="action" id="action" onclick="if(event.target===this)closeAction()"><div class="action-box" id="action-box"></div></div>
  <!-- メニュー -->
  <div class="menu-mask" id="menu-mask" onclick="closeMenu()"></div>
  <div class="menu" id="menu"></div>

  <div class="toast" id="toast"></div>
  <input type="file" id="picker" accept="image/*" multiple hidden>
</div>

/* ---------- サンプル写真（絵を描いて作る） ---------- */
function sampleImage(seed,hex){
  const c=document.createElement("canvas");c.width=600;c.height=600;const g=c.getContext("2d");
  const skies=[["#BFE3FF","#FFF1DA"],["#FFD6C9","#FFF6E0"],["#D9D3FF","#FFE9F2"],["#C9F1E6","#FFFBE6"]];
  const sk=skies[seed%skies.length];const gr=g.createLinearGradient(0,0,0,600);gr.addColorStop(0,sk[0]);gr.addColorStop(1,sk[1]);g.fillStyle=gr;g.fillRect(0,0,600,600);
  g.fillStyle="#FFE08A";g.beginPath();g.arc(140+(seed*97)%320,140,46,0,7);g.fill();
  g.fillStyle=hex;g.globalAlpha=.55;g.beginPath();g.moveTo(0,600);g.lineTo(0,380);g.lineTo(180+(seed*31)%80,250);g.lineTo(360,400);g.lineTo(470,300);g.lineTo(600,420);g.lineTo(600,600);g.fill();
  g.globalAlpha=.85;g.beginPath();g.moveTo(0,600);g.lineTo(0,470);g.quadraticCurveTo(300,380+(seed*13)%60,600,480);g.lineTo(600,600);g.fill();g.globalAlpha=1;
  return c.toDataURL("image/jpeg",.8);
}
function starterSet(withSamples){
  const set=[["家族","home",[["日々のこと","orange",4],["記念日","pink",2]]],["学校","school",[["行事","yellow",5],["おたより・書類","blue",1]]],["仕事","work",[["資料","indigo",1],["メモ","gray",0]]],["友達","group",[["あそび","purple",3],["ごはん","red",2]]],["趣味","favorite",[["お気に入り","pink",2],["作品","green",2]]],["自然","eco",[["風景","mint",3],["花・植物","green",2]]]];
  let seed=0;
  const ccol={"家族":"pink","学校":"blue","仕事":"indigo","友達":"orange","趣味":"purple","自然":"green"};
  set.forEach(([n,ic,fs])=>{const c={id:id(),name:n,icon:ic,color:ccol[n]||"pink"};S.cats.push(c);
    fs.forEach(([fn,col,cnt])=>{const f={id:id(),name:fn,color:col,catId:c.id};S.folders.push(f);
      if(withSamples)for(let i=0;i<cnt;i++){S.photos.push({id:id(),folderId:f.id,src:sampleImage(seed++,COLORS[col]),memo:i===0&&fn==="行事"?"運動会のリレー":"",inLib:seed%3===0,date:Date.now()-seed*86400000})}
    })});
  render();
}

function catPhotos(cid){const fids=S.folders.filter(f=>f.catId===cid).map(f=>f.id);return S.photos.filter(p=>fids.includes(p.folderId)).sort((a,b)=>b.date-a.date)}
function renderHome(){
  const el=$("#home");
  if(S.tab!=="home"){renderTabRoot();return}
  if(!S.cats.length&&!S.folders.length){
    el.innerHTML=headerHTML(false)+`<div class="empty" style="padding-top:20px"><img src="${APP_ICON}" alt="フォトポケットのアイコン" style="width:120px;height:120px;border-radius:27px;box-shadow:0 8px 24px rgba(242,103,138,.25);margin:0 auto 18px;display:block"><h3>ようこそ！</h3><p>写真を「分類」と「フォルダ」に分けて、<br>すっきりしまっておけるアプリです。<br>まずは入れ物を作りましょう。</p><button class="bigbtn" onclick="starterSet(true)"><span class="ms">auto_awesome</span>おすすめのセットで始める</button><br><button class="textbtn" style="margin-top:10px" onclick="openCatEditor()">自分で分類を作る</button></div>`;
    return;
  }
  let h=headerHTML(true)+`<div class="wrap">`;
  h+=`<div class="sec-head" style="margin-top:28px"><h2>分類 <span class="sub" style="font-weight:500">${S.cats.length}こ</span></h2><button class="addchip" onclick="openCatEditor()"><span class="ms">add</span>追加</button></div><div class="grid2">`;
  S.cats.forEach(c=>{const col=catColor(c);const fs=S.folders.filter(f=>f.catId===c.id);const ps=catPhotos(c.id);
    h+=`<div class="card ccard" onclick="openCategory('${c.id}')" oncontextmenu="event.preventDefault();catMenu(event,'${c.id}')"><span class="ms chev">chevron_right</span><div class="cicon" style="background:${col}24;color:${col}"><span class="ms">${c.icon}</span></div><div><div class="cname">${esc(c.name)}</div><div class="sub" style="font-size:12px">フォルダ${fs.length}つ・${ps.length}枚</div></div><div class="mini">${ps.slice(0,4).map(p=>`<span style="background-image:url(${p.src})"></span>`).join("")||`<span style="background:${col}22"></span>`}</div></div>`});
  h+=`<button class="addcard" style="min-height:170px" onclick="openCatEditor()"><span class="plus"><span class="ms">add</span></span>分類を追加</button></div>`;
  const none=S.folders.filter(f=>!catById(f.catId));
  if(none.length){h+=`<div class="sec-head"><h2>未分類のフォルダ</h2></div><div class="grid2">${none.map(folderCardHTML).join("")}</div>`}
  el.innerHTML=h+`</div>`;
}
function folderCardHTML(f){const ps=folderPhotos(f.id);const col=COLORS[f.color];
  const pic=ps.length?`<div style="background-image:url(${ps[0].src})"></div>`:`<div style="background:linear-gradient(#CFE7FA,#F3F9FF);display:flex;align-items:center;justify-content:center"><span class="ms" style="color:#9CC9EE;font-size:26px">image</span></div>`;
  return `<div class="card fcard" onclick="openFolder('${f.id}')" oncontextmenu="event.preventDefault();folderMenu(event,'${f.id}')"><div class="fold"><div class="tabp" style="background:${col};filter:brightness(.92)"></div><div class="back" style="background:${col};filter:brightness(.95)"></div><div class="pic">${pic}</div><div class="front" style="background:${col};opacity:.9;clip-path:inset(55% 0 0 0 round 0 0 16px 16px)"></div></div><div class="frow"><div style="min-width:0"><b style="display:block">${esc(f.name)}</b><span class="sub">${ps.length?ps.length+"枚":"まだ空っぽ"}</span></div><span class="ms" style="color:var(--text)">chevron_right</span></div></div>`}

/* ---------- 分類の中（フォルダ一覧） ---------- */
function openCategory(cid){S.curCat=cid;renderCategory();$("#cat").classList.remove("off");$("#home").classList.add("under")}
function closeCategory(){$("#cat").classList.add("off");$("#home").classList.remove("under");S.curCat=null;render()}
function renderCategory(){const c=catById(S.curCat);if(!c){closeCategory();return}const col=catColor(c);const fs=S.folders.filter(f=>f.catId===c.id);
  let h=`<div class="nav"><button onclick="closeCategory()"><span class="ms">chevron_left</span>ホーム</button><b></b><button onclick="catMenu(event,'${c.id}')" aria-label="メニュー"><span class="ms">more_horiz</span></button></div>
  <div class="wrap"><div class="row" style="margin:6px 2px 18px"><div class="cicon" style="background:${col}24;color:${col};width:54px;height:54px"><span class="ms">${c.icon}</span></div><div><div style="font-size:26px;font-weight:800">${esc(c.name)}</div><div class="sub">フォルダ${fs.length}つ・${catPhotos(c.id).length}枚</div></div></div>
  <div class="grid2">${fs.map(folderCardHTML).join("")}<button class="addcard" style="min-height:190px" onclick="openFolderEditor(null,'${c.id}')"><span class="plus"><span class="ms">add</span></span>フォルダを追加</button></div></div>`;
  $("#cat").innerHTML=h}

/* ---------- タブ（すべての写真・フォルダ・最近の写真） ---------- */
function renderTabbar(){const tabs=[["home","home","ホーム"],["all","image","すべての写真"],["folders","folder","フォルダ"],["recent","schedule","最近の写真"]];
  const t=$("#tabbar");t.innerHTML=tabs.map(([k,i,l])=>`<button class="${S.tab===k?"on":""}" onclick="switchTab('${k}')"><span class="ms">${i}</span>${l}</button>`).join("");
  t.classList.toggle("hide",S.selecting)}
function switchTab(k){S.tab=k;S.selecting=false;S.selected.clear();if(S.cur){$("#folder").classList.add("off");S.cur=null}$("#cat").classList.remove("under");if(S.curCat){$("#cat").classList.add("off");S.curCat=null}$("#home").classList.remove("under");$("#home").scrollTop=0;render()}
function photoGrid(ps,clickFn){return `<div class="grid3">`+ps.map(p=>`<div class="th" onclick="${clickFn}('${p.id}')"><img src="${p.src}" alt="">${p.inLib?`<span class="lib"><span class="ms">smartphone</span></span>`:""}${p.memo?`<span class="memo"><span class="ms">chat_bubble</span></span>`:""}</div>`).join("")+`</div>`}
function openFromAnywhere(pid){const p=S.photos.find(x=>x.id===pid);if(!p)return;S.cur=p.folderId;S.selecting=false;S.selected.clear();renderFolder();openViewer(pid)}
function renderTabRoot(){const el=$("#home");let h="";
  if(S.tab==="all"){const ps=[...S.photos].sort((a,b)=>b.date-a.date);h=`<div class="root-title">すべての写真</div><div class="wrap">`;
    if(!ps.length)h+=`<div class="empty"><div class="halo"><div><span class="ms">image</span></div></div><h3>写真はまだありません</h3><p>フォルダを開いて取り込みましょう。</p></div>`;
    else{let last="";ps.forEach(p=>{const d=new Date(p.date);const k=`${d.getFullYear()}年${d.getMonth()+1}月`;if(k!==last){if(last)h+=`</div>`;h+=`<div class="dayh">${k}</div><div class="grid3">`;last=k}h+=`<div class="th" onclick="openFromAnywhere('${p.id}')"><img src="${p.src}" alt="">${p.inLib?`<span class="lib"><span class="ms">smartphone</span></span>`:""}</div>`});h+=`</div>`}
    h+=`</div>`}
  if(S.tab==="folders"){h=`<div class="root-title">フォルダ</div>`;
    const groups=S.cats.map(c=>[c,S.folders.filter(f=>f.catId===c.id)]);const none=S.folders.filter(f=>!catById(f.catId));
    groups.forEach(([c,fs])=>{h+=`<div class="list-h">${esc(c.name)}</div><div class="list flist">`+(fs.length?fs.map(f=>`<button class="li" onclick="openFolder('${f.id}')"><span class="ms" style="color:${COLORS[f.color]}">folder</span><span style="flex:1">${esc(f.name)}</span><span class="sub">${folderPhotos(f.id).length}枚</span><span class="ms" style="color:var(--sub)">chevron_right</span></button>`).join(""):`<button class="li" onclick="openFolderEditor(null,'${c.id}')" style="color:var(--accent)"><span class="ms">add</span>フォルダを追加</button>`)+`</div>`});
    if(none.length)h+=`<div class="list-h">未分類</div><div class="list flist">`+none.map(f=>`<button class="li" onclick="openFolder('${f.id}')"><span class="ms" style="color:${COLORS[f.color]}">folder</span><span style="flex:1">${esc(f.name)}</span><span class="sub">${folderPhotos(f.id).length}枚</span></button>`).join("")+`</div>`;
    if(!S.folders.length&&!S.cats.length)h+=`<div class="empty"><p>まだフォルダがありません。</p></div>`}
  if(S.tab==="recent"){const ps=[...S.photos].sort((a,b)=>(b.added||0)-(a.added||0)||b.date-a.date).slice(0,30);h=`<div class="root-title">最近の写真</div><div class="wrap"><div class="sub" style="margin:-6px 4px 12px">最近取り込んだ写真（新しい順）</div>`+(ps.length?photoGrid(ps,"openFromAnywhere"):`<div class="empty"><div class="halo"><div><span class="ms">schedule</span></div></div><h3>まだありません</h3><p>取り込んだ写真がここに並びます。</p></div>`)+`</div>`}
  el.innerHTML=h}

/* ---------- フォルダ ---------- */
function openFolder(fid){S.cur=fid;S.selecting=false;S.selected.clear();renderFolder();$("#folder").classList.remove("off");(S.curCat?$("#cat"):$("#home")).classList.add("under")}
function closeFolder(){$("#folder").classList.add("off");if(S.curCat){$("#cat").classList.remove("under");renderCategory()}else $("#home").classList.remove("under");S.cur=null;render()}
function renderFolder(){
  const f=folderById(S.cur);if(!f)return;const ps=folderPhotos(f.id);const col=COLORS[f.color];const cat=catById(f.catId);
  const inLib=ps.filter(p=>p.inLib);
  let h=`<div class="nav">${S.selecting?`<button onclick="toggleAll()">${S.selected.size===ps.length?"選択解除":"すべて選択"}</button><b>${esc(f.name)}</b><button onclick="endSelect()">完了</button>`:`<button onclick="closeFolder()"><span class="ms">chevron_left</span>${S.curCat?esc(catById(S.curCat)?.name||"戻る"):"戻る"}</button><b>${esc(f.name)}</b><button onclick="folderPageMenu(event)" aria-label="メニュー"><span class="ms">more_horiz</span></button>`}</div>`;
  if(!ps.length){
    h+=`<div class="empty"><div class="halo"><div><span class="ms">add_photo_alternate</span></div></div><h3>まだ写真がありません</h3><p>写真アプリから選んで取り込みましょう。<br>取り込んだあと、写真アプリの写真を<br>消すか残すか選べます。</p><button class="bigbtn" onclick="pick()"><span class="ms">add</span>写真を取り込む</button></div>`;
  }else{
    h+=`<div class="wrap"><div class="card row" style="padding:14px;margin-bottom:14px"><div class="badge" style="width:46px;height:46px;background:${col}2e;color:${col}"><span class="ms">folder</span></div><div style="flex:1"><div style="font-weight:800">${esc(f.name)}</div><div class="sub">${cat?esc(cat.name)+" ・ ":""}${ps.length}枚</div></div>${inLib.length&&!S.selecting?`<button onclick="askCleanup()" style="border:none;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:6px 10px;font:inherit;font-size:11px;font-weight:800;cursor:pointer;line-height:1.3"><span class="ms" style="font-size:18px">smartphone</span><br>${inLib.length}枚</button>`:""}</div>`;
    if(inLib.length&&!S.selecting)h+=`<div class="sub" style="font-size:12px;margin:-6px 4px 10px"><span class="ms" style="font-size:14px;vertical-align:-2px">smartphone</span> マーク付き＝写真アプリにも残っている写真</div>`;
    h+=`<div class="grid3">`+ps.map(p=>`<div class="th ${S.selected.has(p.id)?"sel":""}" onclick="tapPhoto('${p.id}')"><img src="${p.src}" alt="">${p.inLib?`<span class="lib"><span class="ms">smartphone</span></span>`:""}${p.memo?`<span class="memo"><span class="ms">chat_bubble</span></span>`:""}${S.selecting?`<span class="chk">${S.selected.has(p.id)?'<span class="ms" style="font-size:16px;color:#fff">check</span>':""}</span>`:""}</div>`).join("")+`</div></div>`;
  }
  if(S.selecting){
    const any=S.selected.size>0;const anyLib=[...S.selected].some(i=>S.photos.find(p=>p.id===i)?.inLib);
    h+=`<div class="selbar"><button ${any?"":"disabled"} onclick="openMove('select')"><span class="ms">drive_file_move</span>移動</button><span class="sub" style="font-size:13px">${S.selected.size}枚選択</span><button ${any?"":"disabled"} onclick="selectDeleteMenu(${anyLib})"><span class="ms">delete</span>削除など</button></div>`;
  }else if(ps.length){
    h+=`<div class="fab"><button class="bigbtn" onclick="pick()"><span class="ms">add</span>写真を取り込む</button></div>`;
  }
  $("#folder").innerHTML=h;
  renderTabbar();
}
function tapPhoto(pid){if(S.selecting){S.selected.has(pid)?S.selected.delete(pid):S.selected.add(pid);renderFolder()}else openViewer(pid)}
function toggleAll(){const ps=folderPhotos(S.cur);if(S.selected.size===ps.length)S.selected.clear();else ps.forEach(p=>S.selected.add(p.id));renderFolder()}
function endSelect(){S.selecting=false;S.selected.clear();renderFolder()}

/* ---------- 取り込み ---------- */
function pick(){$("#picker").value="";$("#picker").click()}
$("#picker").addEventListener("change",async e=>{
  const files=[...e.target.files];if(!files.length)return;
  toast(`取り込み中… 0/${files.length}`);const added=[];
  for(let i=0;i<files.length;i++){
    try{const src=await shrink(files[i]);const p={id:id(),folderId:S.cur,src,memo:"",inLib:true,date:files[i].lastModified||Date.now(),added:Date.now()+i};S.photos.push(p);added.push(p)}catch(err){}
    toast(`取り込み中… ${i+1}/${files.length}`);
  }
  renderFolder();
  if(!added.length){toast("取り込めませんでした");return}
  S.justImported=added.map(p=>p.id);
  if(S.policy==="keep"){toast(`${added.length}枚を取り込みました`)}
  else if(S.policy==="delete"){systemDeleteConfirm(S.justImported)}
  else showAction(`${added.length}枚を取り込みました`,"写真アプリの元の写真はどうしますか？<br>削除しても、このアプリには残ります。削除した写真は写真アプリの「最近削除した項目」に30日間残ります。",[
    {label:"写真アプリから削除する",danger:true,fn:()=>systemDeleteConfirm(S.justImported)},
    {label:"写真アプリに残す",fn:()=>toast("写真アプリにも残しました")}]);
});
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const m=1400,r=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.85))};img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
/* iPhoneが出す確認画面の再現 */
function systemDeleteConfirm(ids){
  const n=ids.length;
  setTimeout(()=>showAction(`「フォトポケット」が${n}枚の写真を削除することを許可しますか？`,"この写真は「最近削除した項目」に移動され、30日後に完全に削除されます。（iPhoneが表示する確認画面です）",[
    {label:"削除",danger:true,bold:true,fn:()=>{ids.forEach(i=>{const p=S.photos.find(x=>x.id===i);if(p)p.inLib=false});rerender();toast(`Web版では写真アプリの写真は消えません。写真アプリで削除してください`)}},
    {label:"許可しない",fn:()=>toast("写真アプリの写真はそのまま残っています")}],true),260);
}
function askCleanup(){const ids=folderPhotos(S.cur).filter(p=>p.inLib).map(p=>p.id);
  showAction(`写真アプリに残っている${ids.length}枚を削除しますか？`,"このアプリ内の写真はそのまま残ります。",[{label:"写真アプリから削除する",danger:true,fn:()=>systemDeleteConfirm(ids)}])}

/* ---------- ビューア ---------- */
function openViewer(pid){const ps=folderPhotos(S.cur);S.vIndex=Math.max(0,ps.findIndex(p=>p.id===pid));renderViewer();$("#viewer").classList.add("show")}
function closeViewer(){$("#viewer").classList.remove("show");renderFolder()}
function curPhoto(){return folderPhotos(S.cur)[S.vIndex]}
function stepViewer(d){const n=folderPhotos(S.cur).length;S.vIndex=(S.vIndex+d+n)%n;renderViewer()}
function renderViewer(){const ps=folderPhotos(S.cur);const p=ps[S.vIndex];if(!p){closeViewer();return}
  $("#v-pic").src=p.src;const d=new Date(p.date);$("#v-title").textContent=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}  ${S.vIndex+1}/${ps.length}`;
  $("#v-lib").textContent=p.inLib?"smartphone":"";$("#v-memo").innerHTML=p.memo?`<span>${esc(p.memo)}</span>`:"";$("#v-memo-ic").textContent=p.memo?"chat":"chat_bubble";
  document.querySelectorAll(".v-arrow").forEach(b=>b.style.display=ps.length>1?"flex":"none")}
(()=>{let x0=null;const el=$("#v-img");el.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});el.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)stepViewer(dx<0?1:-1);x0=null});
  let zoom=false;el.addEventListener("dblclick",()=>{zoom=!zoom;$("#v-pic").style.transform=zoom?"scale(2.2)":"none"})})();
function viewerMenu(){const p=curPhoto();const items=[{label:"写真アプリに保存",fn:()=>sharePhotos([p])}];
  if(p.inLib)items.push({label:"写真アプリから削除（アプリには残す）",danger:true,fn:()=>systemDeleteConfirm([p.id])});
  items.push({label:"このアプリから削除",danger:true,fn:()=>confirmAppDelete([p.id])});
  showAction("この写真",p.inLib?"写真アプリにも残っています。":"写真アプリからは削除済みです。",items)}
function openMemo(){const p=curPhoto();
  openSheet(`<div class="sheet-head"><button class="textbtn" onclick="closeSheet()">キャンセル</button><b>メモ</b><button class="textbtn" onclick="saveMemo()">保存</button></div><div class="field"><label>この写真のメモ</label><input id="memo-in" value="${esc(p.memo)}" placeholder="例：運動会のリレー"></div>`);setTimeout(()=>$("#memo-in").focus(),300)}
function saveMemo(){curPhoto().memo=$("#memo-in").value.trim();closeSheet();renderViewer()}

/* ---------- 削除・移動 ---------- */
function confirmAppDelete(ids){const gone=ids.filter(i=>!S.photos.find(p=>p.id===i)?.inLib).length;
  showAction(`${ids.length}枚をこのアプリから削除しますか？`,gone?`そのうち${gone}枚は写真アプリから削除済みです。アプリから消すと元に戻せません。`:"写真アプリには元の写真が残っています。",[{label:"アプリから削除",danger:true,fn:()=>{S.photos=S.photos.filter(p=>!ids.includes(p.id));S.selected.clear();S.selecting=false;if($("#viewer").classList.contains("show")){const n=folderPhotos(S.cur).length;if(!n)closeViewer();else{S.vIndex=Math.min(S.vIndex,n-1);renderViewer()}}renderFolder();toast("削除しました")}}])}
function selectDeleteMenu(anyLib){const ids=[...S.selected];const items=[];
  if(anyLib)items.push({label:"写真アプリから削除（アプリには残す）",danger:true,fn:()=>{systemDeleteConfirm(ids.filter(i=>S.photos.find(p=>p.id===i)?.inLib));endSelect()}});
  items.push({label:"写真アプリに保存",fn:()=>{sharePhotos(ids.map(i=>S.photos.find(p=>p.id===i)).filter(Boolean));endSelect()}});
  items.push({label:"このアプリから削除",danger:true,fn:()=>confirmAppDelete(ids)});
  showAction(`${ids.length}枚を選択中`,"",items)}
function openMove(from){
  let h=`<div class="sheet-head"><button class="textbtn" onclick="closeSheet()">キャンセル</button><b>移動先のフォルダ</b><span style="width:70px"></span></div>`;
  const groups=S.cats.map(c=>[c.name,S.folders.filter(f=>f.catId===c.id)]);const none=S.folders.filter(f=>!catById(f.catId));if(none.length)groups.push(["未分類",none]);
  groups.forEach(([n,fs])=>{if(!fs.length)return;h+=`<div class="list-h">${esc(n)}</div><div class="list">`+fs.map(f=>`<button class="li" ${f.id===S.cur?"disabled style='opacity:.4'":""} onclick="doMove('${f.id}','${from}')"><span class="ms" style="color:${COLORS[f.color]}">folder</span>${esc(f.name)}${f.id===S.cur?'<span class="sub" style="margin-left:auto">現在</span>':""}</button>`).join("")+`</div>`});
  openSheet(h)}
function doMove(fid,from){const ids=from==="viewer"?[curPhoto().id]:[...S.selected];ids.forEach(i=>{const p=S.photos.find(x=>x.id===i);if(p)p.folderId=fid});closeSheet();
  toast(`「${folderById(fid).name}」に${ids.length}枚移動しました`);
  if(from==="viewer"){const n=folderPhotos(S.cur).length;if(!n)closeViewer();else{S.vIndex=Math.min(S.vIndex,n-1);renderViewer()}}else endSelect()}

/* ---------- 分類・フォルダの作成 ---------- */
let ed={};
function openCatEditor(cid){const c=cid?catById(cid):null;ed={kind:"cat",id:cid,name:c?c.name:"",icon:c?c.icon:ICONS[0],color:c?(c.color||"pink"):"pink"};drawCatEditor()}
function drawCatEditor(){openSheet(`<div class="sheet-head"><button class="textbtn" onclick="closeSheet()">キャンセル</button><b>${ed.id?"分類を編集":"新しい分類"}</b><button class="textbtn" onclick="saveCat()">保存</button></div>
  <div class="preview"><div class="badge" style="border-radius:22px;background:${COLORS[ed.color]}24;color:${COLORS[ed.color]}"><span class="ms">${ed.icon}</span></div><b id="pv-name" style="${ed.name?"":"color:var(--sub)"}">${esc(ed.name||"分類の名前")}</b></div>
  <div class="field"><label>分類の名前</label><input id="cat-name" value="${esc(ed.name)}" placeholder="例：子ども、家族、書類" oninput="ed.name=this.value;const p=$('#pv-name');p.textContent=this.value||'分類の名前';p.style.color=this.value?'':'var(--sub)'"></div>
  <div class="field"><label>色</label><div class="colors">${Object.keys(COLORS).map(k=>`<button style="background:${COLORS[k]};${k===ed.color?"box-shadow:0 0 0 3px var(--bg),0 0 0 5px "+COLORS[k]:""}" onclick="ed.color='${k}';drawCatEditor()" aria-label="${COLOR_NAMES[k]}">${k===ed.color?'<span class="ms" style="font-size:18px">check</span>':""}</button>`).join("")}</div></div>
  <div class="field"><label>アイコン</label><div class="icons">${ICONS.map(i=>`<button class="${i===ed.icon?"on":""}" onclick="ed.icon='${i}';drawCatEditor()" aria-label="${i}"><span class="ms">${i}</span></button>`).join("")}</div></div>`,true)}
function saveCat(){const n=(ed.name||"").trim();if(!n){toast("分類の名前を入れてください");return}
  if(ed.id){const c=catById(ed.id);c.name=n;c.icon=ed.icon;c.color=ed.color}else S.cats.push({id:id(),name:n,icon:ed.icon,color:ed.color});closeSheet();rerender()}
function openFolderEditor(fid,catId){const f=fid?folderById(fid):null;ed={kind:"folder",id:fid,name:f?f.name:"",color:f?f.color:"orange",catId:f?f.catId:(catId||"")};drawFolderEditor()}
function drawFolderEditor(){const col=COLORS[ed.color];const cat=catById(ed.catId);
  openSheet(`<div class="sheet-head"><button class="textbtn" onclick="closeSheet()">キャンセル</button><b>${ed.id?"フォルダを編集":"新しいフォルダ"}</b><button class="textbtn" onclick="saveFolder()">保存</button></div>
  <div class="preview"><div class="badge" style="background:${col}2e;color:${col}"><span class="ms">folder</span></div><b id="pv-name" style="${ed.name?"":"color:var(--sub)"}">${esc(ed.name||"フォルダの名前")}</b>${cat?`<div class="sub">${esc(cat.name)}</div>`:""}</div>
  <div class="field"><label>フォルダの名前</label><input id="f-name" value="${esc(ed.name)}" placeholder="例：運動会、保険の書類、旅行2026" oninput="ed.name=this.value;const p=$('#pv-name');p.textContent=this.value||'フォルダの名前';p.style.color=this.value?'':'var(--sub)'"></div>
  <div class="field"><label>分類</label><select onchange="ed.catId=this.value;drawFolderEditor()"><option value="">未分類</option>${S.cats.map(c=>`<option value="${c.id}" ${c.id===ed.catId?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
  <div class="field"><label>色</label><div class="colors">${Object.keys(COLORS).map(k=>`<button style="background:${COLORS[k]};${k===ed.color?"box-shadow:0 0 0 3px var(--bg),0 0 0 5px "+COLORS[k]:""}" onclick="ed.color='${k}';drawFolderEditor()" aria-label="${COLOR_NAMES[k]}">${k===ed.color?'<span class="ms" style="font-size:18px">check</span>':""}</button>`).join("")}</div></div>`,true)}
function saveFolder(){const n=(ed.name||"").trim();if(!n){toast("フォルダの名前を入れてください");return}
  if(ed.id){const f=folderById(ed.id);Object.assign(f,{name:n,color:ed.color,catId:ed.catId})}else S.folders.push({id:id(),name:n,color:ed.color,catId:ed.catId});closeSheet();rerender()}

/* ---------- メニュー ---------- */
function showMenu(ev,items){const m=$("#menu");m.innerHTML=items.map((it,i)=>`<button class="${it.danger?"danger":""}" data-i="${i}">${it.label}<span class="ms">${it.icon}</span></button>`).join("");
  m.querySelectorAll("button").forEach(b=>b.onclick=()=>{closeMenu();items[b.dataset.i].fn()});
  const app=$("#app").getBoundingClientRect();const r=ev.currentTarget?ev.currentTarget.getBoundingClientRect():{right:ev.clientX,bottom:ev.clientY};
  m.style.display="block";m.style.top=Math.min(r.bottom-app.top+6,app.height-m.offsetHeight-10)+"px";m.style.right=Math.max(10,app.right-r.right)+"px";$("#menu-mask").style.display="block"}
function closeMenu(){$("#menu").style.display="none";$("#menu-mask").style.display="none"}
function addMenu(ev){showMenu(ev,[{label:"新しいフォルダ",icon:"create_new_folder",fn:()=>openFolderEditor()},{label:"新しい分類",icon:"grid_view",fn:()=>openCatEditor()}])}
function catMenu(ev,cid){showMenu(ev,[{label:"この分類にフォルダを追加",icon:"create_new_folder",fn:()=>openFolderEditor(null,cid)},{label:"分類を編集",icon:"edit",fn:()=>openCatEditor(cid)},{label:"分類を削除",icon:"delete",danger:true,fn:()=>{const c=catById(cid);showAction(`分類「${esc(c.name)}」を削除しますか？`,"中のフォルダと写真は消えずに「未分類」に移ります。",[{label:"分類を削除",danger:true,fn:()=>{S.cats=S.cats.filter(x=>x.id!==cid);S.folders.forEach(f=>{if(f.catId===cid)f.catId=""});if(S.curCat===cid)closeCategory();else render()}}])}}])}
function folderMenu(ev,fid){showMenu(ev,[{label:"フォルダを編集",icon:"edit",fn:()=>openFolderEditor(fid)},{label:"フォルダを削除",icon:"delete",danger:true,fn:()=>{const f=folderById(fid);const n=folderPhotos(fid).length;showAction(`フォルダ「${esc(f.name)}」を削除しますか？`,`中の写真${n}枚もアプリから削除されます。`,[{label:"フォルダと中の写真を削除",danger:true,fn:()=>{S.folders=S.folders.filter(x=>x.id!==fid);S.photos=S.photos.filter(p=>p.folderId!==fid);render()}}])}}])}
function folderPageMenu(ev){const ps=folderPhotos(S.cur);const inLib=ps.filter(p=>p.inLib).length;showMenu(ev,[
  {label:"写真を選択",icon:"check_circle",fn:()=>{if(!ps.length){toast("写真がありません");return}S.selecting=true;renderFolder()}},
  {label:"フォルダを編集",icon:"edit",fn:()=>openFolderEditor(S.cur)},
  {label:"写真アプリに残っている分を削除…",icon:"mobile_off",danger:true,fn:()=>{if(!inLib){toast("写真アプリに残っている写真はありません");return}askCleanup()}},
  {label:"すべて写真アプリに保存",icon:"download",fn:()=>ps.length?sharePhotos(ps):toast("写真がありません")}])}

/* ---------- 設定・課金 ---------- */
function openSettings(){
  const total=S.photos.length,lib=S.photos.filter(p=>p.inLib).length;
  openSheet(`<div class="sheet-head"><span style="width:70px"></span><b>設定</b><button class="textbtn" onclick="closeSheet()">完了</button></div>
  <div class="list-h">iCloud</div><div class="list">${S.unlocked?`<div class="li"><span class="ms" style="color:#34C759">cloud_done</span>iCloudに同期しています</div>`:`<div class="li"><span class="ms" style="color:var(--sub)">smartphone</span>このiPhoneの中だけに保存しています</div><button class="li" onclick="closeSheet();setTimeout(openUnlock,320)" style="color:var(--accent)"><span class="ms">cloud</span>iCloud同期を使う（買い切り）<span class="sub" style="margin-left:auto">¥600</span></button><button class="li" style="color:var(--accent)" onclick="toast('復元できる購入が見つかりませんでした（デモ）')"><span class="ms">restore</span>購入を復元</button>`}</div>
  <div class="note">${S.unlocked?"写真と分類・フォルダは、あなたのiCloudに自動で保存されます。":"無料版では、写真はこのiPhoneの中に保存されます。"}</div>
  <div class="list-h">画面のモード</div><div style="margin:0 16px"><div class="seg">${[["light","ライト"],["dark","ダーク"],["system","端末に合わせる"]].map(([k,l])=>`<button class="${S.mode===k?"on":""}" onclick="setMode('${k}');openSettings()">${l}</button>`).join("")}</div></div>
  <div class="list-h">取り込み後の写真アプリの写真</div><div style="margin:0 16px"><div class="seg">${[["ask","毎回たずねる"],["keep","いつも残す"],["delete","いつも削除"]].map(([k,l])=>`<button class="${S.policy===k?"on":""}" onclick="S.policy='${k}';openSettings()">${l}</button>`).join("")}</div></div>
  <div class="note">削除するときは、必ずiPhoneの確認画面が出ます。削除した写真は「最近削除した項目」に30日間残ります。</div>
  <div class="list-h">保存状況</div><div class="list"><div class="li">写真の枚数<span class="sub" style="margin-left:auto">${total}枚</span></div><div class="li">写真アプリにも残っている<span class="sub" style="margin-left:auto">${lib}枚</span></div></div>
  <div class="list"><button class="li" style="color:var(--danger)" onclick="confirmReset()"><span class="ms">delete_forever</span>すべてのデータを消す</button></div>`)}
function openUnlock(){
  openSheet(`<div class="sheet-head"><button class="textbtn" onclick="closeSheet()">${S.unlocked?"閉じる":"あとで"}</button><span></span><span style="width:60px"></span></div>
  <div style="text-align:center;padding:0 24px"><div class="halo"><div><span class="ms">${S.unlocked?"cloud_done":"cloud"}</span></div></div><div style="font-size:22px;font-weight:800;margin-bottom:8px">${S.unlocked?"iCloud同期を使っています":"iCloudで写真をまもる"}</div><div class="sub" style="font-size:14px;line-height:1.7;margin-bottom:20px">${S.unlocked?"ご購入ありがとうございます。":"1回の購入で、ずっと使えます。<br>月額ではありません。"}</div></div>
  <div class="card" style="margin:0 18px 22px;padding:18px">
  ${[["cloud_sync","自動でiCloudに保存","取り込んだ写真・フォルダ・メモがiCloudに保存されます"],["phone_iphone","機種変更・入れ直しも安心","同じApple IDなら、新しいiPhoneでもそのまま戻ります"],["devices","iPhoneとiPadで同じ内容","同じApple IDの端末どうしで自動で同期します"],["delete_forever","写真アプリから消しても安心","写真アプリを整理しても、写真はiCloudに残ります"]].map(([i,t,d])=>`<div class="benefit"><div class="badge"><span class="ms" style="font-size:20px">${i}</span></div><div><div style="font-weight:800">${t}</div><div class="sub">${d}</div></div></div>`).join("")}</div>
  ${S.unlocked?"":`<div style="text-align:center;padding:0 24px"><button class="bigbtn" style="width:100%;justify-content:center" onclick="buy()">¥600で購入する（買い切り）</button><br><button class="textbtn" style="margin-top:6px" onclick="toast('復元できる購入が見つかりませんでした（デモ）')">購入を復元</button><div class="sub" style="font-size:11.5px;line-height:1.6;margin-top:8px">価格は例です。iCloudの保存容量は、お使いのiCloudの空き容量を使います。</div></div>`}`)}
function buy(){showAction("App Store","フォトポケット iCloud同期<br>¥600（買い切り）<br>（デモ：実際の購入は行われません）",[{label:"購入する",bold:true,fn:()=>{S.unlocked=true;closeSheet();render();setTimeout(()=>toast("ありがとうございます！iCloud同期が使えるようになりました"),300)}}])}
function resetDemo(){if(S.curCat){$("#cat").classList.add("off");S.curCat=null}$("#home").classList.remove("under");Object.assign(S,{tab:"home",cats:[],folders:[],photos:[],policy:"ask",unlocked:false,hideBanner:false});closeSheet();if(S.cur)closeFolder();render()}

/* ---------- 共通UI ---------- */
function openSheet(html,keep){const sh=$("#sheet");const y=keep?sh.scrollTop:0;sh.innerHTML=html;$("#overlay").classList.add("show");sh.scrollTop=y}
function closeSheet(){$("#overlay").classList.remove("show")}
function showAction(title,msg,items,noCancel){
  const box=$("#action-box");box.innerHTML=`<div class="ab-group"><div class="ab-title"><b>${title}</b>${msg?`<span>${msg}</span>`:""}</div>${items.map((it,i)=>`<button class="${it.danger?"danger":""} ${it.bold?"bold":""}" data-i="${i}">${it.label}</button>`).join("")}</div>${noCancel?"":`<div class="ab-group"><button class="bold" data-c="1">キャンセル</button></div>`}`;
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{closeAction();if(b.dataset.i!==undefined)items[b.dataset.i].fn()});
  $("#action").classList.add("show")}
function closeAction(){$("#action").classList.remove("show")}
function rerender(){render();if(S.curCat)renderCategory();if(S.cur)renderFolder();if($("#viewer").classList.contains("show"))renderViewer()}
function applyMode(){const dark=S.mode==="dark"||(S.mode==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.toggle("dark",dark)}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{applyMode()});
function setMode(m){S.mode=m;try{localStorage.setItem("pp-mode",m)}catch(e){}applyMode();render();toast(m==="light"?"ライトモードにしました":m==="dark"?"ダークモードにしました":"端末の設定に合わせます")}
function modeMenu(ev){showMenu(ev,[["light","ライトモード","light_mode"],["dark","ダークモード","dark_mode"],["system","端末に合わせる","contrast"]].map(([k,l,i])=>({label:(S.mode===k?"✓ ":"")+l,icon:i,fn:()=>setMode(k)})))}
function render(){renderHome();renderTabbar();if(S.curCat&&!$("#cat").classList.contains("off"))renderCategory()}
/* ---------- iPhoneの中に保存（IndexedDB） ---------- */
const DB={db:null,saved:new Set(),timer:null,ready:false};
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("photopocket",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("kv");d.createObjectStore("photos")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=DB.db.transaction(store,mode);const st=t.objectStore(store);const out=fn(st);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})}
async function loadState(){
  try{DB.db=await idb();
    const meta=await tx("kv","readonly",st=>st.get("state"));
    if(meta){const srcs=await tx("photos","readonly",st=>st.getAll());const keys=await tx("photos","readonly",st=>st.getAllKeys());const map={};keys.forEach((k,i)=>map[k]=srcs[i]);
      Object.assign(S,{cats:meta.cats||[],folders:meta.folders||[],policy:meta.policy||"ask",unlocked:!!meta.unlocked,hideBanner:!!meta.hideBanner});
      S.photos=(meta.photos||[]).filter(p=>map[p.id]).map(p=>({...p,src:map[p.id]}));
      keys.forEach(k=>DB.saved.add(k));uid=Math.max(uid,meta.uid||1)}
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){console.log("保存なし",e)}
  DB.ready=true}
function scheduleSave(){if(!DB.ready||!DB.db)return;clearTimeout(DB.timer);DB.timer=setTimeout(saveState,400)}
async function saveState(){
  try{const meta={cats:S.cats,folders:S.folders,policy:S.policy,unlocked:S.unlocked,hideBanner:S.hideBanner,uid,photos:S.photos.map(({src,...m})=>m)};
    const ids=new Set(S.photos.map(p=>p.id));
    const toAdd=S.photos.filter(p=>!DB.saved.has(p.id));const toDel=[...DB.saved].filter(k=>!ids.has(k));
    await new Promise((res,rej)=>{const t=DB.db.transaction(["kv","photos"],"readwrite");t.objectStore("kv").put(meta,"state");const ps=t.objectStore("photos");toAdd.forEach(p=>ps.put(p.src,p.id));toDel.forEach(k=>ps.delete(k));t.oncomplete=res;t.onerror=()=>rej(t.error)});
    toAdd.forEach(p=>DB.saved.add(p.id));toDel.forEach(k=>DB.saved.delete(k));
  }catch(e){toast("保存できませんでした。iPhoneの空き容量を確認してください")}}
["render","renderFolder","renderViewer"].forEach(n=>{const f=window[n];window[n]=function(){const r=f.apply(this,arguments);scheduleSave();return r}});
function confirmReset(){showAction("すべてのデータを消しますか？","このアプリに保存した分類・フォルダ・写真がすべて消えます。写真アプリの写真は消えません。",[{label:"すべて消す",danger:true,fn:()=>{resetDemo();scheduleSave();toast("すべてのデータを消しました")}}])}
/* 写真アプリに保存：共有シートの「画像を保存」から */
async function sharePhotos(list){
  if(!list.length)return;
  try{const files=await Promise.all(list.map(async(p,i)=>{const b=await (await fetch(p.src)).blob();return new File([b],`photo_${i+1}.jpg`,{type:"image/jpeg"})}));
    if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}
    toast("このブラウザでは保存できません。写真を長押しして保存してください")
  }catch(e){if(e&&e.name==="AbortError")return;toast("保存をキャンセルしました")}}
applyMode();
loadState().then(()=>{render()});
</script>
