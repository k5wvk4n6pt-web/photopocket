name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testflight:
        description: "TestFlightに送信する"
        type: boolean
        default: true
      cloudkit_env:
        description: "iCloudの環境（最初の1回だけ Development）"
        type: choice
        options: [Production, Development]
        default: Production

jobs:
  # 1) 毎回：署名なしでビルドできるか確認
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (simulator)
        run: |
          xcodebuild -project PhotoPocket.xcodeproj -scheme PhotoPocket \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  # 2) 手動実行時：署名してTestFlightへ送信
  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    env:
      # キーIDとIssuer IDは、それだけでは使えない識別番号なのでここに書いています（秘密の鍵 .p8 は Secrets に保存）
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || '92PK3R5RPW' }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || 'e3178071-c454-4e88-8acb-00967574cc49' }}
      TEAM_ID: ${{ secrets.TEAM_ID || 'C4C5896L77' }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${TEAM_ID}/" ExportOptions.plist
      - name: Archive
        run: |
          xcodebuild -project PhotoPocket.xcodeproj -scheme PhotoPocket \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PhotoPocket.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" \
            CLOUDKIT_ENV=${{ inputs.cloudkit_env }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive
      - name: Export & upload to App Store Connect
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PhotoPocket.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
