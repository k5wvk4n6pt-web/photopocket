name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testflight:
        description: "TestFlightに送信する"
        type: boolean
        default: true
      cloudkit_env:
        description: "iCloudの環境（最初の1回だけ Development）"
        type: choice
        options: [Production, Development]
        default: Production

jobs:
  # 1) 毎回：署名なしでビルドできるか確認
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (simulator)
        run: |
          xcodebuild -project PhotoPocket.xcodeproj -scheme PhotoPocket \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  # 2) 手動実行時：署名してTestFlightへ送信（Macも実機の登録も不要）
  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    env:
      # キーIDとIssuer IDは、それだけでは使えない識別番号なのでここに書いています（秘密の鍵 .p8 は Secrets に保存）
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || 'e3178071-c454-4e88-8acb-00967574cc49' }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID || '92PK3R5RPW' }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: com.k5wvk4n6pt.photopocket
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages codemagic-cli-tools PyJWT cryptography
      - name: Generate project
        run: xcodegen generate
      - name: Code signing (App Store)
        env:
          # 証明書用の鍵。Secrets に CERT_PRIVATE_KEY があれば毎回同じ証明書を使い回す
          CERT_PRIVATE_KEY: ${{ secrets.CERT_PRIVATE_KEY }}
        run: |
          if [ -n "$CERT_PRIVATE_KEY" ]; then
            echo "保存済みの鍵を使って、同じ証明書を使い回します"
            printf '%s\n' "$CERT_PRIVATE_KEY" > "$RUNNER_TEMP/cert_key"
            echo "REUSE_CERT=1" >> "$GITHUB_ENV"
          else
            echo "CERT_PRIVATE_KEY が無いので、一時的な証明書を作ります（ビルド後に取り消し）"
            python3 .github/scripts/asc_certs.py list > "$RUNNER_TEMP/certs_before.txt"
            openssl genrsa -out "$RUNNER_TEMP/cert_key" 2048
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$RUNNER_TEMP/cert_key" \
            --create
          keychain add-certificates
          xcode-project use-profiles
          echo "---- プロファイルの中身（iCloud部分） ----"
          for f in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision; do
            security cms -D -i "$f" > /tmp/p.plist && /usr/libexec/PlistBuddy -c "Print :Entitlements" /tmp/p.plist | grep -i -A3 "icloud\|aps" || true
          done
      - name: Build IPA
        run: |
          xcode-project build-ipa \
            --project PhotoPocket.xcodeproj \
            --scheme PhotoPocket \
            --archive-xcargs "CLOUDKIT_ENV=${{ inputs.cloudkit_env }} APS_ENV=production CURRENT_PROJECT_VERSION=${{ github.run_number }}" \
            || { echo "---- xcodebuild のエラー ----"; grep -h -E "error:|warning: .*(entitlement|profile)" /tmp/xcodebuild_logs/*.log | sort -u | head -40; exit 1; }
      - name: Upload to TestFlight
        run: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA: $IPA"
          app-store-connect publish --path "$IPA"
      - name: Clean up temporary certificate
        # 鍵を保存して使い回しているときは取り消さない（取り消しメールも来なくなる）
        if: always() && env.REUSE_CERT != '1'
        run: python3 .github/scripts/asc_certs.py cleanup "$RUNNER_TEMP/certs_before.txt" || true
