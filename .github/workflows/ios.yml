name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testflight:
        description: "TestFlightに送信する"
        type: boolean
        default: true
      cloudkit_env:
        description: "iCloudの環境（最初の1回だけ Development）"
        type: choice
        options: [Production, Development]
        default: Production

jobs:
  # 1) 毎回：署名なしでビルドできるか確認
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (simulator)
        run: |
          xcodebuild -project PhotoPocket.xcodeproj -scheme PhotoPocket \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  # 2) 手動実行時：署名してTestFlightへ送信（Macも実機の登録も不要）
  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    env:
      # キーIDとIssuer IDは、それだけでは使えない識別番号なのでここに書いています（秘密の鍵 .p8 は Secrets に保存）
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || 'e3178071-c454-4e88-8acb-00967574cc49' }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID || '92PK3R5RPW' }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: com.k5wvk4n6pt.photopocket
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages codemagic-cli-tools PyJWT cryptography
      - name: Generate project
        run: xcodegen generate
      - name: Code signing (App Store)
        run: |
          python3 .github/scripts/asc_certs.py list > "$RUNNER_TEMP/certs_before.txt"
          openssl genrsa -out "$RUNNER_TEMP/cert_key" 2048
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$RUNNER_TEMP/cert_key" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        run: |
          xcode-project build-ipa \
            --project PhotoPocket.xcodeproj \
            --scheme PhotoPocket \
            --archive-xcargs "CLOUDKIT_ENV=${{ inputs.cloudkit_env }} APS_ENV=production CURRENT_PROJECT_VERSION=${{ github.run_number }}"
      - name: Upload to TestFlight
        run: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA: $IPA"
          app-store-connect publish --path "$IPA"
      - name: Clean up temporary certificate
        if: always()
        run: python3 .github/scripts/asc_certs.py cleanup "$RUNNER_TEMP/certs_before.txt" || true
