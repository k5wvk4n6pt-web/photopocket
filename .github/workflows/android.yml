name: Android Build

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: APKをビルド
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: 最新版としてリリースに置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk photopocket.apk
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --title "フォトポケット Android版（最新）" \
              --notes "Androidにそのまま入れて使える版です。photopocket.apk をダウンロードして開いてください。"
          fi
          gh release upload android-latest photopocket.apk --clobber
          echo "ビルド番号: ${{ github.run_number }}"
